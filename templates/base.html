{% load static %}

<!DOCTYPE html>
<html lang="fa" dir="rtl" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/x-icon" href="{% static 'image/fav.png' %}' %}">
    <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/toastify-js@1.12.0/src/toastify.min.css">
    <link rel="stylesheet" href="{% static 'css/main.css' %}">
    <link rel="stylesheet" href="{% static 'css/nouislider.min.css' %}">
    <link rel="stylesheet" href="{% static 'css/font.css' %}">
    <link rel="stylesheet" href="{% static 'css/output.css' %}">
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    <link rel="stylesheet" href="{% static 'css/swiper.min.css' %}">

    {% block extra_css %}  {% endblock %}

    <title>{% block title %} فروشگاه {% endblock %}</title>
</head>

<body class="max-w-[1700px] mx-auto">

<!-- loading -->
<div id="loading"
     class="z-50 fixed inset-0 flex flex-col items-center justify-center bg-gradient-to-bl from-zinc-50 to-zinc-100 transition-opacity duration-700">
    <div class="wrapper">
        <div class="circle"></div>
        <div class="circle"></div>
        <div class="circle"></div>
        <div class="shadow"></div>
        <div class="shadow"></div>
        <div class="shadow"></div>
    </div>
    <div class="flex items-center gap-6 mt-10">
        <img class="max-w-20 md:max-w-36" src="{% static 'image/logo.png' %}" alt="">
        <div class="text-xl md:text-3xl font-yekanBakhExtraBold text-zinc-800">فروشگاه آنلاین دیجیتو</div>
    </div>
</div>

<!-- progress bar -->
<div id="progressBar"></div>

{% include 'include/header.html' %}

<main class="mt-0 md:mt-8">
    {% block content %}

    {% endblock %}
</main>

{% include 'include/footer.html' %}

</body>


<script src="https://cdn.jsdelivr.net/npm/toastify-js@1.12.0/src/toastify.min.js"></script>
<script src="{% static 'js/swiper.min.js' %}"></script>
<script src="{% static 'js/sliders.js' %}"></script>
<script src="{% static 'js/nouislider.min.js' %}"></script>
<script src="{% static 'js/main.js' %}"></script>
<script>
    const modal1 = document.getElementById('modal1');
    const modal2 = document.getElementById('modal2');
    const modalBox1 = document.querySelector('#modal1 .modal-box');
    const modalBox2 = document.querySelector('#modal2 .modal-box');

    function openModal() {
        modal1.classList.remove('hidden');
        modal1.classList.add('flex');
        setTimeout(() => {
            if (modalBox1) modalBox1.classList.remove('opacity-0', 'scale-90');
            if (modalBox1) modalBox1.classList.add('opacity-100', 'scale-100');
        }, 10);
    }

    function showRegister() {
        modal2.classList.remove('hidden');
        modal2.classList.add('flex');
        setTimeout(() => {
            if (modalBox2) modalBox2.classList.remove('opacity-0', 'scale-90');
            if (modalBox2) modalBox2.classList.add('opacity-100', 'scale-100');
        }, 10);
    }

    function showLogin() {
        closeModal2();
        modal1.classList.remove('hidden');
        modal1.classList.add('flex');
        setTimeout(() => {
            if (modalBox1) modalBox1.classList.remove('opacity-0', 'scale-90');
            if (modalBox1) modalBox1.classList.add('opacity-100', 'scale-100');
        }, 10);
    }

    function closeModal1() {
        if (modalBox1) {
            modalBox1.classList.remove('opacity-100', 'scale-100');
            modalBox1.classList.add('opacity-0', 'scale-90');
        }
        setTimeout(() => {
            modal1.classList.add('hidden');
            modal1.classList.remove('flex');
        }, 300);
    }

    function closeModal2() {
        if (modalBox2) {
            modalBox2.classList.remove('opacity-100', 'scale-100');
            modalBox2.classList.add('opacity-0', 'scale-90');
        }
        setTimeout(() => {
            modal2.classList.add('hidden');
            modal2.classList.remove('flex');
        }, 300);
    }

    modal1.addEventListener('click', function (e) {
        if (e.target === modal1) closeModal1();
    });
    modal2.addEventListener('click', function (e) {
        if (e.target === modal2) closeModal2();
    });

    const urlParams = new URLSearchParams(window.location.search);
    const modalParam = urlParams.get('modal');


    if (modalParam === 'register') {
        showRegister();

        const url = new URL(window.location.href);
        url.searchParams.delete('modal');
        window.history.replaceState({}, '', url);
    } else if (modalParam === 'open' || modalParam === 'login') {
        openModal();

        const url = new URL(window.location.href);
        url.searchParams.delete('modal');
        window.history.replaceState({}, '', url);
    } else {

        let hasLoginError = false;
        {% for message in messages %}
            if ("{{ message.tags }}" === "error") {

                const messageText = "{{ message }}";
                if (messageText.includes('ایمیل') || messageText.includes('رمز') || messageText.includes('ثبت نام')) {

                    if (messageText.includes('ثبت نام') || messageText.includes('قبلاً') || messageText.includes('تکرار')) {
                        showRegister();
                    } else {
                        openModal();
                    }
                } else {
                    openModal();
                }
            }
        {% endfor %}
    }
</script>
<script>
    document.addEventListener('DOMContentLoaded', function () {
        const categoryItems = document.querySelectorAll('.category-item');
        const panels = document.querySelectorAll('.subcategory-panel');

        categoryItems.forEach(function (item) {
            item.addEventListener('mouseenter', function () {
                categoryItems.forEach(i => i.classList.remove('active-category'));
                item.classList.add('active-category');

                const targetId = item.dataset.category;
                panels.forEach(function (panel) {
                    panel.style.display = (panel.dataset.panel === targetId) ? 'contents' : 'none';
                });
            });
        });
    });
</script>

{% include 'messages.html' %}

{% block extra_js %}  {% endblock %}
</html>
