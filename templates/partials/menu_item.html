{% load static %}

<li>
    {% if category.children_list %}
        <button type="button" class="menu-toggle flex justify-between w-full py-3 px-4 hover:bg-gray-100 rounded-lg">
            <div class="flex items-center gap-x-1">
                {% if depth == 0 %}
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M15.25 2.75H8.75C7.09315 2.75 5.75 4.09315 5.75 5.75V18.25C5.75 19.9069 7.09315 21.25 8.75 21.25H15.25C16.9069 21.25 18.25 19.9069 18.25 18.25V5.75C18.25 4.09315 16.9069 2.75 15.25 2.75Z"
                              stroke="#71717b" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"></path>
                        <path d="M11 17.75H13" stroke="#71717b" stroke-width="1.5" stroke-linecap="round"
                              stroke-linejoin="round"></path>
                    </svg>
                {% endif %}
                <span>{{ category.name }}</span>
            </div>
            <img class="w-4 transition-transform opacity-80" src="{% static 'image/icons/arrowDown.svg' %}" alt="">
        </button>

        <ul class="submenu hidden pr-6 space-y-2">
            {% for child in category.children_list %}
                {% include 'partials/menu_item.html' with category=child depth=depth|add:1 %}
            {% endfor %}
        </ul>

    {% else %}
        <a href="#" class="block py-2 px-4 hover:bg-gray-100 rounded-md">
            {{ category.name }}
        </a>
    {% endif %}
</li>
